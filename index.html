<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心动计划·像素实验室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* 像素实验室：深色街机单主题。墨蓝底/金色主色/青色辅助，CRT 扫描线。 */
:root{
  color-scheme:dark;
  --bg:#0b0d1c; --bg2:#10132a; --panel:#171b36; --panel2:#1f2447;
  --line:#39406e; --line2:#565f9e;
  --fg:#e9ecff; --dim:#9aa3d6; --faint:#6a72a8;
  --gold:#ffd23f; --gold-dk:#b98f14;
  --green:#5fe08a; --red:#ff5d73; --cyan:#5ad0ff; --purple:#b48cff;
  --shadow:rgba(0,0,0,.5);
  --f-disp:'Press Start 2P',monospace;
  --f-body:'Noto Sans SC',system-ui,sans-serif;
  --f-mono:'JetBrains Mono','Noto Sans SC',monospace;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 44px;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.3) 100%);
}
#wrap{max-width:800px;margin:0 auto}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.4;text-wrap:balance;margin:0 0 10px}
.disp{font-family:var(--f-disp)}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:16px 18px;margin:0 0 16px}
.panel.flat{box-shadow:none}
.panel2{background:var(--panel2)}
.btn{
  font-family:var(--f-disp);font-size:11px;letter-spacing:1px;
  background:var(--gold);color:#15130a;border:3px solid #15130a;
  box-shadow:0 4px 0 var(--gold-dk),4px 4px 0 var(--shadow);
  padding:11px 18px;cursor:pointer;text-transform:uppercase;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dk)}
.btn.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line2);box-shadow:0 4px 0 #22264d,4px 4px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 #22264d}
.btn.small{font-size:9px;padding:8px 12px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;border:2px solid var(--line2);color:var(--dim);background:var(--bg2);padding:1px 8px;margin:0 6px 6px 0}
.tag.gold{color:var(--gold);border-color:var(--gold-dk)}
.tag.cyan{color:var(--cyan);border-color:#2a6a86}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:13px}
hr.px{border:none;border-top:3px solid var(--line);margin:14px 0}
/* 状态条 */
#status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:9px 14px;margin:0 0 18px;font-size:13px}
#status .grow{flex:1 1 130px;min-width:110px}
.lv{font-family:var(--f-disp);font-size:10px;color:var(--gold);white-space:nowrap}
.xpbar{height:12px;background:var(--bg2);border:2px solid var(--line2);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--gold-dk) 8px 12px);transform-origin:left}
#status button{font-family:var(--f-disp);font-size:9px;background:var(--panel2);color:var(--dim);border:2px solid var(--line2);padding:6px 9px;cursor:pointer}
#status button:hover{color:var(--fg)}
/* 标题屏 */
#scr-title{text-align:center;padding-top:30px}
#scr-title .sub{font-family:var(--f-disp);font-size:10px;color:var(--cyan);letter-spacing:2px;margin:12px 0 4px}
#scr-title h1{font-size:52px;font-weight:900;letter-spacing:6px;color:var(--gold);text-shadow:0 6px 0 var(--gold-dk),6px 6px 0 rgba(0,0,0,.5);margin:4px 0}
#scr-title .logo2{font-family:var(--f-disp);font-size:13px;letter-spacing:1px}
.pixelbox{display:inline-block;padding:16px;border:3px solid var(--line);background:var(--panel);box-shadow:5px 5px 0 var(--shadow);image-rendering:pixelated}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(4px)}}
/* 关卡路径 */
.lvl{display:flex;flex-direction:column;gap:0}
.node{display:flex;gap:14px;align-items:stretch}
.node .rail{display:flex;flex-direction:column;align-items:center;width:34px;flex:none}
.node .dot{width:34px;height:34px;border:3px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:10px;color:var(--dim);flex:none}
.node .wire{width:4px;flex:1;background:var(--line);min-height:14px}
.node:last-child .wire{display:none}
.node .card{flex:1;min-width:0;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:12px 14px;margin:0 0 14px;cursor:pointer}
.node .card:hover{border-color:var(--line2)}
.node.locked .card{opacity:.42;cursor:not-allowed}
.node.done .dot{background:#123a24;border-color:var(--green);color:var(--green)}
.node.done .card{border-color:#2c7c4a}
.node .nm{font-weight:900;font-size:16px}
/* 实验台 */
.stagebar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.st{flex:1 1 100px;min-width:96px;text-align:center;font-size:12px;border:2px solid var(--line);background:var(--bg2);color:var(--faint);padding:6px 4px}
.st.now{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
.st.ok{border-color:#2c7c4a;color:var(--green)}
.goal{font-size:15px}
.codebox{overflow-x:auto;background:#0d1024;border:3px solid var(--line);padding:10px 12px;box-shadow:4px 4px 0 var(--shadow);margin:10px 0}
.codebox pre{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.85}
.cline{white-space:pre;display:flex}
.cline .no{width:30px;flex:none;text-align:right;margin-right:12px;color:#3d4577;user-select:none}
.cline.hl{color:var(--gold)}
.cline.cur{background:rgba(255,210,63,.14);outline:1px solid rgba(255,210,63,.4)}
.cline .tx{min-width:0}
/* 代码填空 */
.binput{border:none;border-bottom:2px dashed var(--gold);background:rgba(255,210,63,.09);color:var(--fg);font-family:var(--f-mono);font-size:13px;padding:0 4px;text-align:center;outline:none}
.binput:focus{background:rgba(255,210,63,.18)}
.binput.bwrong{border-bottom-color:var(--red);background:rgba(255,93,115,.1);color:var(--red)}
.bsolved{color:var(--gold);border-bottom:2px solid var(--green);padding:0 4px}
.bbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
/* 手机：输入框 ≥16px，避免 iOS 聚焦时自动放大页面 */
@media (pointer:coarse){.inrow input,.binput{font-size:16px}}
/* 控制台 */
.term{background:#070a18;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:12px 14px;font-family:var(--f-mono);font-size:13px;line-height:1.8;overflow-x:auto;white-space:pre-wrap;word-break:break-all;min-height:64px}
.term .c{color:var(--cyan)}.term .g{color:var(--green)}.term .r{color:var(--red)}
.term .d{color:var(--faint)}.term .y{color:var(--gold)}
.inrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.inrow label{font-size:12px;color:var(--dim);align-self:center}
.inrow input{flex:1 1 180px;min-width:140px;font-family:var(--f-mono);font-size:13px;background:#0d1024;color:var(--fg);border:2px solid var(--line2);padding:8px 10px}
.preset{font-size:12px;font-weight:700;background:var(--bg2);color:var(--cyan);border:2px solid #2a6a86;padding:5px 10px;cursor:pointer}
.preset:hover{background:#12283a}
.switch{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.switch button{font-family:var(--f-body);font-weight:700;font-size:13px;background:var(--bg2);color:var(--dim);border:2px solid var(--line2);padding:5px 14px;cursor:pointer}
.switch button.on{background:#3a2f0a;color:var(--gold);border-color:var(--gold-dk)}
/* 变量表 / 追踪 */
.vt{font-family:var(--f-mono);font-size:13px;border:2px solid var(--line);background:#0d1024;margin-top:10px}
.vt .vr{display:flex;border-bottom:1px solid #1c2244}
.vt .vr:last-child{border-bottom:none}
.vt .k{width:110px;flex:none;padding:4px 10px;color:var(--faint);border-right:1px solid #1c2244}
.vt .val{padding:4px 10px;color:var(--gold);word-break:break-all}
.tnote{font-size:13px;color:var(--cyan);margin-top:8px;min-height:1.4em}
.tctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.guess{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.guess button{font-family:var(--f-mono);font-size:14px;background:var(--panel2);color:var(--fg);border:2px solid var(--line2);padding:10px 16px;cursor:pointer}
.guess button:hover{border-color:var(--cyan)}
.guess button.good{border-color:var(--green);color:var(--green);background:#12281a}
.guess button.badd{border-color:var(--red);color:var(--red);background:#2a1016;cursor:default}
.fb{margin-top:10px;font-size:14px;border-top:2px dashed var(--line);padding-top:8px}
.center{text-align:center}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:14px}
details.orig{border:2px solid var(--line);background:var(--bg2);padding:8px 12px;margin:10px 0}
details.orig summary{cursor:pointer;font-weight:700;color:var(--cyan)}
.note{font-size:13px;color:var(--faint);border-left:4px solid var(--line2);padding:4px 12px;margin:10px 0}
.blink{animation:blk 1s steps(2) infinite}
@keyframes blk{50%{opacity:.3}}
canvas.grid{image-rendering:pixelated;border:2px solid var(--line);background:#0d1024;display:block;margin-top:10px;max-width:100%}
.qboxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-family:var(--f-mono);font-size:13px}
.qb{border:2px solid var(--line2);background:var(--bg2);padding:4px 10px}
.qb.top{border-color:var(--gold);color:var(--gold)}
.srow{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px}
.srow span{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line2);background:var(--bg2)}
.srow span.b{border-color:var(--red);color:var(--red)}
.srow span.win{border-color:var(--gold);background:#3a2f0a;color:var(--gold)}
@media (prefers-reduced-motion: reduce){.bob,.blink{animation:none}}
</style>
<div id="wrap">
  <div id="status" hidden>
    <span class="lv" id="st-lv"></span>
    <span class="grow"><span class="xpbar"><i id="st-xp"></i></span></span>
    <span class="dim small" id="st-misc"></span>
    <button id="bt-snd">SND:ON</button>
    <button id="bt-map">关卡表</button>
  </div>
  <main id="scr-title"></main>
  <main id="scr-map" hidden></main>
  <main id="scr-lab" hidden></main>
</div>
<script>
"use strict";
/* ============ 通用 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const SKEY="xtp_pixel_lab_v2";
let SAVE={xp:0,done:{},snd:true};
function loadSave(){try{const r=localStorage.getItem(SKEY);if(r)SAVE=Object.assign(SAVE,JSON.parse(r))}catch(e){}}
function saveSave(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}}
const RANK=[[0,"LV1 实验员"],[200,"LV2 助理研究员"],[400,"LV3 研究员"],[600,"LV4 资深研究员"],[800,"LV5 首席科学家"]];
function rank(xp){let i=0;for(let k=0;k<RANK.length;k++)if(xp>=RANK[k][0])i=k;return i}
let AC=null;
function tone(f,dur,type,vol,delay){
  if(!SAVE.snd)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||"square";o.frequency.value=f;
    g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const sfx={
  click(){tone(660,.05)},ok(){tone(880,.08);tone(1320,.1,"square",.06,.09)},
  err(){tone(150,.15,"sawtooth",.09)},pass(){tone(784,.06);tone(1046,.08,"square",.06,.07)},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,.11,"square",.07,i*.1))}
};
function parseNums(v){
  const parts=v.split(/[\s,，]+/).filter(x=>x.length);
  const out=[];
  for(const p of parts){const n=Number(p);if(!Number.isInteger(n))return null;out.push(n)}
  return out;
}
const i32=n=>{n=n|0;return n};
/* ============ 数据：九个实验关卡 ============ */
const LEVELS=[
{ id:"L0", name:"热身 · 累加器", ch:"入门", diff:1,
  intro:"先用几个小实验熟悉实验台：改输入、点运行、单步看变量、亲手补代码。之后每一关都是这个节奏。",
  stages:[
  { t:"实验 1 · 它会算什么？", kind:"demo", need:{any:true},
    d:"下面是一段真的会这样执行的 C++。在输入框里随便改几个整数，点【运行】，看输出怎么跟着变；再点【单步追踪】，看 sum 一步一步怎么长。",
    demo:{
      code:["#include <iostream>","using namespace std;","int main() {","    int sum = 0;","    int x;","    while (cin >> x) {   // 逐个读入，直到输入结束","        sum += x;","    }","    cout << sum << endl;","}"],
      ui:"free", ph:"例：5, -3, 2", def:"5, -3, 2",
      run(v){const a=parseNums(v);let s=0;for(const x of a)s+=x;return String(s)},
      trace(v){const a=parseNums(v);const fr=[];let s=0;
        fr.push({l:3,v:[["sum","0"]],note:"sum 从 0 开始"});
        a.forEach((x,i)=>{s+=x;fr.push({l:6,v:[["x",String(x)],["sum",String(s)]],note:"读入 "+x+"，累加"})});
        fr.push({l:8,v:[["sum",String(s)]],note:"输出 sum",out:String(s)});
        return fr}
    }},
  { t:"实验 2 · 先猜再跑", kind:"guess", need:{guess:true},
    d:"同样的程序，输入固定为 5, -3, 2。先在心里算一遍，再选答案——选完程序会真的跑给你看。",
    guess:{show:"输入: 5, -3, 2", q:"cout 会输出什么？", opts:["4","10","-10"], ci:0,
      why:"5 + (-3) + 2 = 4。负数在 C++ 里照常参与运算，循环对它一视同仁。"}},
  { t:"实验 3 · 跑翻它：int 装不下", kind:"demo", need:{any:true},
    d:"输入固定为 2000000000 和 2000000000。这段代码编译没问题、逻辑也没问题——点【▶ 运行】，看 int 给出什么答案。",
    demo:{
      code:["#include <iostream>","using namespace std;","int main() {","    int sum = 0;         // int 只有 32 位","    int x;","    while (cin >> x) {","        sum += x;","    }","    cout << sum << endl;","}"],
      ui:"fixed", fixed:"2000000000, 2000000000",
      run(v){return "-294967296   ← 两个 20 亿相加，怎么会是负数？"},
      note(){return "int 的最大值约 21.4 亿。40 亿把它绕回了一圈——就像里程表从 999999 跳回 000000。这叫溢出。"}
    }},
  { t:"实验 4 · 你来改：一行救回来", kind:"demo", need:{blanks:true},
    d:"同样的输入，同样的程序——但代码里有一个金色空。把 sum 换成装得下 40 亿的类型：直接在空里打字，点【✓ 检查】，再【▶ 运行】。",
    demo:{
      code:["#include <iostream>","using namespace std;","int main() {","    %0 sum = 0;      // ← 只改这里","    int x;","    while (cin >> x) {","        sum += x;","    }","    cout << sum << endl;","}"],
      ui:"fixed", fixed:"2000000000, 2000000000",
      blanks:[{ph:"类型名（两个单词）",accept:["long long","long long int"],ans:"long long",
        hints:["出问题的不是算法，是 sum 的类型——32 位装不下 40 亿","C++ 的 64 位整数类型是两个单词，long 开头"]}],
      run(v){return "4000000000   ← 对了"},
      note(){return "同一个输入，换一个类型，结果从 -294967296 变回 4000000000。题 5、题 10、题 30 的累计值都要这样处理。"}
    }},
  { t:"小结", kind:"tests", need:{tests:true},
    d:"实验台四件事你已经会了：改输入→运行、先猜再跑、单步看变量、亲手补代码。记住 int 溢出这个坑，后面题 5、题 10、题 30 都要用 long long。进入第一个正式题目：遥控小车。",
    tests:{title:"热身完成", cases:[
      {in:"5, -3, 2", exp:"4", got:"4", note:"实验 1"},
      {in:"5, -3, 2（先猜）", exp:"4", got:"4", note:"实验 2"},
      {in:"2000000000, 2000000000（int 版）", exp:"-294967296", got:"-294967296", note:"实验 3：溢出"},
      {in:"2000000000, 2000000000（你来改后）", exp:"4000000000", got:"4000000000", note:"实验 4：long long"}]}}
]}
,
{ id:"L1", name:"遥控小车", ch:"题 23 · 坐标模拟", diff:1,
  intro:"小车听一串 G/L/R 指令行动。先玩沙盘，再用最笨的实现跑一遍，看它在哪翻车。",
  stages:[
  { t:"实验 1 · 沙盘：小车怎么走", kind:"demo", need:{any:true},
    d:"规则：G 前进 1 格，L 左转 90°（原地），R 右转 90°（原地）。初始在原点、面朝北。改指令或点预设，单步看小车每一步的位置和朝向。",
    demo:{
      code:["// 三个指令","// G：直走 1 单位","// L：左转 90°（原地）","// R：右转 90°（原地）","// 初始：(0,0) 面朝北"],
      ui:"free", ph:"只许 G / L / R", def:"GLGRG",
      validate(v){if(!/^[GRL]*$/.test(v))return "指令只能是 G、L、R";if(!v.length)return "至少给一条指令";return null},
      presets:[{l:"GG",v:"GG"},{l:"GLGRG",v:"GLGRG"},{l:"GLLG",v:"GLLG"},{l:"RRRR",v:"RRRR"}],
      run(v){const s=simCar(v);const p=s[s.length-1];return "["+p.x+", "+p.y+"]"},
      trace(v){const s=simCar(v);return s.map((p,i)=>{
        const act=i===0?"起点 (0,0)，面朝北":(v[i-1]==="G"?"G：朝面朝方向走一步":(v[i-1]==="L"?"L：原地左转 90°":"R：原地右转 90°"));
        return {car:p,cmd:(i===0?"起点":v[i-1]),note:act+" → 位置 ("+p.x+", "+p.y+")"};
      })}
    }},
  { t:"实验 2 · 最简实现：只管往前走", kind:"demo", need:{preset:"GLLG"},
    d:"第一版代码：以为小车永远朝北，G 就 y+1，L/R 直接忽略。点预设 GLLG 跑一遍——再对照上面沙盘里 GLLG 的真实结果。",
    demo:{
      code:["pair<int,int> Run(const string& cmds) {","    int x = 0, y = 0;","    for (char c : cmds) {","        if (c == 'G') y += 1;   // 以为永远朝北","        // L、R？没记朝向，只好忽略","    }","    return {x, y};","}"],
      ui:"free", ph:"只许 G / L / R", def:"GLLG",
      validate(v){if(!/^[GRL]*$/.test(v))return "指令只能是 G、L、R";return null},
      presets:[{l:"GLLG",v:"GLLG"}],
      run(v){let y=0;for(const c of v)if(c==="G")y++;return "["+0+", "+y+"]  ← 答案错了"},

/* 单词工具 */
function countWords(s){let c=0,inW=false;for(const ch of s){if(ch>="a"&&ch<="z"){if(!inW){c++;inW=true}}else inW=false}return c}
function joinLines(lines){
  const segs=[];let cur="",joinNext=false;
  for(const line of lines){
    const cont=line.length>0&&line.endsWith("-");
    if(joinNext){const p=Math.max(0,line.search(/[^ ]/));if(p>=0)cur+=line.slice(p)}
    else cur+=line;
    if(cont){cur=cur.slice(0,-1);joinNext=true}
    else{segs.push({txt:cur});cur="";joinNext=false}
  }
  if(cur!==""||joinNext)segs.push({txt:cur});
  return segs;
}
function simGift(f0,p0){const f=f0.slice(),p=p0.slice();const steps=[];let run=0,guard=0;
  steps.push({gift:{f:f.slice(),p:p.slice()},note:"开局：队列 "+f.length+" 人，栈顶礼物是 "+p[0]});
  while(f.length&&guard++<200){
    if(f[0]===p[0]){const who=f.shift();p.shift();run=0;
      steps.push({gift:{f:f.slice(),p:p.slice()},note:who+" 号员工喜欢栈顶，拿走离开 ✓"})}
    else{const who=f.shift();f.push(who);run++;
      steps.push({gift:{f:f.slice(),p:p.slice()},note:who+" 号不喜欢栈顶 "+p[0]+"，去队尾重排"});
      if(run>=f.length)break}
  }
  steps.push({gift:{f:f.slice(),p:p.slice()},note:"结束：还剩 "+f.length+" 人拿不到礼物（栈顶 "+(p[0]!==undefined?p[0]:"空")+" 没人想要）"});
  return steps;
}

const UNITS=[["year",22*31*24*3600],["month",31*24*3600],["day",24*3600],["hour",3600],["minute",60],["second",1]];
function unitFix(val,unit){
  let total=0;for(const [n,m] of UNITS)if(n===unit)total=val*m;
  let r=[],t=total;
  for(const [n,m] of UNITS){const v=Math.floor(t/m);t%=m;if(v>0)r.push(v+" "+n)}
  return "\""+r.join(" ")+"\"";
}

/* RPN 求值 */
function calc1(op,a,b){switch(op){case "+":return a+b;case "-":return a-b;case "*":return a*b;default:return Math.trunc(a/b)}}
function evalRpn(ts){const st=[];for(const t of ts){
  if(/^[+\-*/]$/.test(t)&&t.length===1){const b=st.pop(),a=st.pop();st.push(calc1(t,a,b))}
  else st.push(+t)}return st[st.length-1]}

function drawSprite(cv){
  const G=["....KKKK....","...KKKKKK...","..KKKKKKKK..","..KKKKKKKK..","..KSSSSSSK..","..KSKSSKSK..","..KSSSSSSK..","...SSSSSS...","..GWGGGGm...",".GGWGGGGmM..",".GGGGGGGmM..",".GGGGGGGGm..",".GGGGGGGG...","..GGGGGG....","..BB..BB....","..BB..BB....",".KKK..KKK..."];
  const P={K:"#171930",S:"#f2c9a0",G:"#e8b04b",W:"#f5f6ff",B:"#23264a",M:"#bfefff",m:"#7c5a12"};

/* ---- 实验台 ---- */
let CUR=null;
function openLevel(i){
  const lv=LEVELS[i];
  CUR={lv,i,st:0,hist:[],tog:{},togRuns:{},ranPresets:{},ranAny:false,tleDone:false,guessDone:false,testsDone:false,
       lastIn:"",frames:null,fi:0,testing:false,blankVals:{},blankDone:{},blankTry:{},blankHint:{}};
  renderLab();showScreen("scr-lab");
}
function needMet(){
  const st=CUR.lv.stages[CUR.st];
  if(st.need.guess)return CUR.guessDone;
  if(st.need.tests)return CUR.testsDone;
  if(st.need.tle)return CUR.tleDone;
  if(st.need.blanks){const bs=st.demo.blanks||[];return bs.every((b,i)=>CUR.blankDone[i])}
  if(st.need.opts){
    const keys=Object.keys(CUR.togRuns);
    const demo=st.demo;
    const all=["base",...demo.toggles.map(t=>t.k)];
    return all.every(k=>CUR.togRuns[k]);
  }
  if(st.need.preset)return !!CUR.ranPresets[st.need.preset];
  return CUR.ranAny;
}
function renderLab(){
  updateStatus();
  const lv=CUR.lv,st=lv.stages[CUR.st];
  let h='<div class="stagebar">';
  let dc=0;
  lv.stages.forEach((s,i)=>{const lab=s.kind==="tests"?"验收":(s.kind==="guess"?"猜一猜":"实验 "+(++dc));h+='<div class="st'+(i===CUR.st?" now":i<CUR.st?" ok":"")+'">'+(i<CUR.st?"✓ ":"")+lab+'</div>'});
  h+='</div>';
  h+='<div class="panel"><div class="ph" style="font-family:var(--f-disp);font-size:10px;color:var(--gold);letter-spacing:1px;margin-bottom:8px">'+lv.name+' · '+st.t+'</div>'+
     '<div class="goal">'+st.d+'</div></div>';
  if(st.kind==="demo")h+=demoPanel(st);
  else if(st.kind==="guess")h+=guessPanel(st);
  else h+=testsPanel(st);
  h+='<div class="actions"><button class="btn" id="bt-next" '+(needMet()?"":"disabled")+'>'+(CUR.st<lv.stages.length-1?"下一步 ▶":"通关 ✓")+'</button></div>';
  $("#scr-lab").innerHTML=h;
  bindLab(st);
}
function codeHtml(st){
  const demo=st.demo;
  const lines=demo.codeFn?demo.codeFn(CUR.tog):demo.code;
  const hlRaw=demo.hl;
  const hlSet=new Set(typeof hlRaw==="function"?hlRaw(CUR.tog):(hlRaw||[]));
  let h='<div class="codebox"><pre>';
  lines.forEach((ln,i)=>{
    h+='<div class="cline'+(hlSet.has(i)?" hl":"")+(CUR.frames&&CUR.traceOn&&CUR.frames[CUR.fi]&&CUR.frames[CUR.fi].l===i?" cur":"")+'"><span class="no">'+String(i+1)+'</span><span class="tx">'+lineTx(st,ln)+'</span></div>';
  });
  return h+'</pre></div>';
}
function lineTx(st,ln){
  if(!st.demo.blanks||String(ln).indexOf("%")<0)return esc(ln);
  const parts=String(ln).split(/%(\d+)/);let out="";
  for(let k=0;k<parts.length;k++){
    if(k%2===0){out+=esc(parts[k])}
    else{
      const n=+parts[k],b=st.demo.blanks[n];
      if(CUR.blankDone[n]){out+='<span class="bsolved">'+esc(CUR.blankVals[n]||b.ans)+'</span>'}
      else{const w=Math.max(5,(b.ans||"").length+3);
        out+='<input class="binput" data-b="'+n+'" value="'+esc(CUR.blankVals[n]||"")+'" placeholder="'+esc(b.ph||"")+'" style="width:'+w+'ch">'}
    }
  }
  return out;
}
function demoPanel(st){
  const demo=st.demo;
  let h=codeHtml(st)+blankBar(st);
  h+='<div class="term" id="term"></div>';
  if(demo.ui==="free"){
    h+='<div class="inrow"><label>输入</label><input id="in" placeholder="'+(demo.ph||"")+'" value="'+esc(CUR.lastIn||(demo.def||""))+'">';
    h+='<button class="btn small" id="bt-run">▶ 运行</button></div>';
  }else if(demo.ui==="fixed"){
    h+='<div class="inrow"><label>输入</label><span class="qb" style="font-family:var(--f-mono)">'+esc(demo.fixed)+'</span><button class="btn small" id="bt-run">▶ 运行</button></div>';
  }
  if(demo.presets){
    h+='<div class="inrow"><label>预设</label>'+demo.presets.map(p=>'<button class="preset" data-v="'+esc(p.v)+'" data-l="'+esc(p.l)+'">'+esc(p.l)+'</button>').join("")+'</div>';
  }
  if(demo.toggles){
    h+='<div class="switch">'+demo.toggles.map(t=>'<button data-k="'+t.k+'"'+(CUR.tog[t.k]?' class="on"':'')+'>⏻ '+t.label+'</button>').join("")+'</div>';
  }
  h+='<div id="tracebox"></div>';
  if(demo.trace)h+='<div class="tctl"><button class="btn ghost small" id="bt-trace">⏯ 单步追踪</button></div>';

function appendTerm(txt,cls){
  const term=$("#term");
  const sp=document.createElement("span");
  sp.className=cls||"c";sp.textContent=txt+"\n";
  term.appendChild(sp);term.scrollTop=term.scrollHeight;
  sfx.click();
}
function doRun(rawIn,label){
  const st=CUR.lv.stages[CUR.st],demo=st.demo;
  if(demo.tle){playTle(demo.tle);return}
  if(demo.blanks&&!blankAllDone(st)){sfx.err();appendTerm("⨯ 编译失败：代码还有空没填——把金色空补上再跑","r");return}
  const v=rawIn;
  if(demo.ui==="free"&&demo.validate){const err=demo.validate(v);if(err){sfx.err();appendTerm("⨯ "+err,"r");return}}
  CUR.lastIn=v;
  const out=demo.run(v,CUR.tog);
  appendTerm("> 输入: "+(label||v),"d");
  appendTerm(out,"y");
  if(demo.note){const n=demo.note(CUR.tog);if(n)appendTerm("↳ "+n,"d")}
  CUR.ranAny=true;
  if(label)CUR.ranPresets[label]=true;
  CUR.togRuns[Object.keys(CUR.tog).filter(k=>CUR.tog[k]).join("+")||"base"]=true;
  const nb=$("#bt-next");if(nb)nb.disabled=!needMet();
}
function playTle(cfg){
  if(CUR.tlePlaying)return;CUR.tlePlaying=true;
  if(cfg.head)appendTerm(cfg.head,"d");
  else appendTerm("> 输入: 把规模拉到题目上限，运行 ——","d");
  let shown=0;
  const steps=[1e4,1e6,5e7,5e8,2e9,4e9,5e9];
  let si=0;
  const tick=()=>{
    if(si>=steps.length){
      appendTerm("⨯ 超时 Time Limit Exceeded（超过 "+cfg.total.toLocaleString()+" "+(cfg.unit||"次")+"仍未跑完）","r");
      appendTerm("↳ 这就是为什么要把 O(n²) 换掉。","d");
      CUR.tleDone=true;CUR.tlePlaying=false;sfx.err();
      const nb=$("#bt-next");if(nb)nb.disabled=!needMet();
      return;
    }
    shown=steps[si++];
    appendTerm("  已比较 "+shown.toLocaleString()+" "+(cfg.unit||"次")+" …","c");
    setTimeout(tick,si<4?300:420);
  };
  tick();
}
function guessPanel(st){

function renderTrace(){

function frameHtml(f){
  let h="";
  if(f.car)h+=carFrame(f.car);
  if(f.gift)h+=giftFrame(f.gift);
  if(f.stack)h+=stackFrame(f.stack);
  if(f.v)h+='<div class="vt">'+f.v.map(p=>'<div class="vr"><span class="k">'+esc(p[0])+'</span><span class="val">'+esc(p[1])+'</span></div>').join("")+'</div>';
  if(f.out!==undefined)h+='<div class="tnote" style="color:var(--gold)">输出: '+esc(f.out)+'</div>';
  return h||'<div class="dim small">(这一步没有变量变化)</div>';

function carFrame(car){
  return '<div style="text-align:center"><canvas id="carcv" class="grid" style="margin:10px auto 0"></canvas>'+
    '<div class="small dim" style="margin-top:8px">位置 ('+car.x+', '+car.y+') · 朝向向量 (dx,dy) = ('+car.dx+', '+car.dy+')</div></div>';
}
function drawCarGrid(cv,car){
  const N=9,C=28,cen=4;
  cv.width=N*C;cv.height=N*C;
  const g=cv.getContext("2d");
  g.fillStyle="#0d1024";g.fillRect(0,0,cv.width,cv.height);
  g.strokeStyle="#23264a";g.lineWidth=1;
  for(let i=0;i<=N;i++){
    g.beginPath();g.moveTo(i*C+.5,0);g.lineTo(i*C+.5,N*C);g.stroke();
    g.beginPath();g.moveTo(0,i*C+.5);g.lineTo(N*C,i*C+.5);g.stroke();
  }
  g.fillStyle="#1c2244";
  g.fillRect(cen*C,0,1,N*C);g.fillRect(0,cen*C,N*C,1);
  const px=(cen+car.x)*C,py=(cen-car.y)*C;
  g.fillStyle="#ffd23f";g.fillRect(px+3,py+3,C-6,C-6);
  const cx=px+C/2,cy=py+C/2,u=car.dx,v=-car.dy;
  g.fillStyle="#15130a";
  g.fillRect(cx-3+u*6,cy-3+v*6,6,6);
  g.fillRect(cx-2-u*5,cy-2-v*5,4,4);
}
function giftFrame(g){
  let h='<div class="small dim" style="margin-top:10px">队列（金色 = 队首）'+(g.f.length?"":"：空")+'</div><div class="qboxes">'+
    g.f.map((x,i)=>'<span class="qb'+(i===0?" top":"")+'">'+esc(x)+'</span>').join("")+'</div>';
  h+='<div class="small dim" style="margin-top:10px">礼物栈（金色 = 栈顶）'+(g.p.length?"":"：空")+'</div><div class="qboxes">'+
    g.p.map((x,i)=>'<span class="qb'+(i===0?" top":"")+'">'+esc(x)+'</span>').join("")+'</div>';
  return h;
}
function stackFrame(a){
  return '<div class="small dim" style="margin-top:10px">栈（金色 = 栈顶）'+(a.length?"":"：空")+'</div><div class="qboxes">'+
    a.map((x,i)=>'<span class="qb'+(i===a.length-1?" top":"")+'">'+esc(x)+'</span>').join("")+'</div>';
}

/* ---- 代码填空 ---- */
function blankNorm(s){return String(s).replace(/\s+/g," ").trim().replace(/;+$/,"").trim()}
function blankAllDone(st){const bs=(st.demo&&st.demo.blanks)||[];return bs.every((b,i)=>CUR.blankDone[i])}
function blankBar(st){
  if(!st.demo.blanks)return "";
  return '<div class="bbar"><button class="btn small" id="bt-check">✓ 检查</button>'+
    '<button class="btn ghost small" id="bt-hint">💡 提示</button>'+
    '<span class="small dim" id="bfb">把代码里的金色空填上，程序才能编译运行</span></div>';
}
function bindBlankInputs(st){
  $$("#scr-lab .binput").forEach(inp=>{
    inp.oninput=()=>{CUR.blankVals[inp.dataset.b]=inp.value;inp.classList.remove("bwrong")};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();checkBlanks(st)}};
  });
  const bc=$("#bt-check");
  if(bc)bc.onclick=()=>{sfx.click();checkBlanks(st)};
  const bh=$("#bt-hint");
  if(bh)bh.onclick=()=>{sfx.click();hintBlank(st)};
}
function checkBlanks(st){
  const bs=st.demo.blanks;let okAll=true,anyTyped=false;
  bs.forEach((b,i)=>{
    if(CUR.blankDone[i])return;
    const v=blankNorm(CUR.blankVals[i]||"");
    if(!v)return;
    anyTyped=true;
    if(b.accept.some(a=>blankNorm(a)===v))CUR.blankDone[i]=true;
    else{okAll=false;CUR.blankTry[i]=(CUR.blankTry[i]||0)+1}
  });
  const emptyLeft=bs.some((b,i)=>!CUR.blankDone[i]&&!blankNorm(CUR.blankVals[i]||""));
  $$("#scr-lab .binput").forEach(inp=>{
    if(!CUR.blankDone[+inp.dataset.b]&&blankNorm(CUR.blankVals[inp.dataset.b]||"")!=="")inp.classList.add("bwrong");
  });
  const fb=$("#bfb");
  if(blankAllDone(st)){
    sfx.ok();
    if(fb)fb.textContent="✔ 全部正确，代码补全了——去点【▶ 运行】看结果";
    appendTerm("✔ 代码补全，编译通过","g");
    if(st.demo.note)appendTerm("↳ "+st.demo.note,"d");
  }else{
    sfx.err();
    if(fb)fb.textContent=emptyLeft&&anyTyped?"有空还没填；填错的红框再想想，卡住就点【💡 提示】":"不对——错两次的空可以点【💡 提示】看思路";
  }
  refreshCode();
  const nb=$("#bt-next");if(nb)nb.disabled=!needMet();
}
function hintBlank(st){
  const bs=st.demo.blanks;
  const i=bs.findIndex((b,k)=>!CUR.blankDone[k]);
  if(i<0)return;
  const b=bs[i],hi=CUR.blankHint[i]||0,fb=$("#bfb");
  if(hi<b.hints.length){
    CUR.blankHint[i]=hi+1;
    if(fb)fb.textContent="空 "+(i+1)+"："+b.hints[hi]+"　（提示 "+(hi+1)+"/"+b.hints.length+"）";
    sfx.click();
  }else{
    CUR.blankVals[i]=b.ans;CUR.blankDone[i]=true;
    if(fb)fb.textContent="空 "+(i+1)+" 已填入答案 "+b.ans+"——对着代码把这行读一遍再继续";
    sfx.pass();
    refreshCode();
    if(blankAllDone(st)){
      appendTerm("✔ 代码补全（有空是看答案填的），编译通过","g");
      const nb=$("#bt-next");if(nb)nb.disabled=!needMet();
    }
  }
}

/* ---- 事件绑定 ---- */
function bindLab(st){
  const demo=st.demo;
  if(st.kind==="demo"){
    bindBlankInputs(st);
    const runBtn=$("#bt-run");
    if(runBtn)runBtn.onclick=()=>{sfx.click();doRun(demo.ui==="fixed"?demo.fixed:$("#in").value,null)};
    const iv=$("#in");
    if(iv)iv.onkeydown=e=>{if(e.key==="Enter"){sfx.click();doRun(iv.value,null)}};
    $$("#scr-lab .preset").forEach(b=>b.onclick=()=>{sfx.click();doRun(b.dataset.v,b.dataset.l)});
    $$("#scr-lab .switch button").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;CUR.tog[k]=!CUR.tog[k];sfx.click();
      b.classList.toggle("on",!!CUR.tog[k]);
      refreshCode();
      if(CUR.frames){CUR.frames=null;CUR.traceOn=false;$("#tracebox").innerHTML="";$("#bt-trace").textContent="⏯ 单步追踪"}
    });
    const bt=$("#bt-trace");
    if(bt)bt.onclick=()=>{sfx.click();toggleTrace()};
  }else if(st.kind==="guess"){
    $$("#scr-lab .guess button").forEach(b=>b.onclick=()=>{
      if(CUR.guessDone)return;
      const i=+b.dataset.i,g=st.guess;
      if(i===g.ci){
        b.classList.add("good");sfx.ok();
        CUR.guessDone=true;
        const fb=$("#gfb");fb.hidden=false;fb.textContent=g.why;
        $("#bt-next").disabled=false;
      }else{
        b.classList.add("badd");b.disabled=true;sfx.err();
        const fb=$("#gfb");fb.hidden=false;fb.textContent="不对——再想想。提示：可以回上一个实验，把这个输入真的跑一遍。";
      }
    });
  }else{
    $("#bt-tests").onclick=()=>{sfx.click();runTests(st)};
  }
  $("#bt-next").onclick=()=>{sfx.click();nextStage()};
}
function nextStage(){
  const lv=CUR.lv;
  if(CUR.st<lv.stages.length-1){CUR.st++;renderLab();window.scrollTo(0,0)}
  else{
    if(CUR.i<LEVELS.length-1)openLevel(CUR.i+1);
    else{renderMap();showScreen("scr-map")}
  }
}
function runTests(st){
  if(CUR.testing)return;CUR.testing=true;
  const ts=st.tests;
  appendTerm("$ 提交判题机 …","d");
  let i=0;
  const step=()=>{
    if(i>=ts.cases.length){
      appendTerm("✔ 全部通过！关卡完成","g");
      if(!SAVE.done[CUR.lv.id]){SAVE.done[CUR.lv.id]=true;SAVE.xp+=100;saveSave();sfx.win()}
      else sfx.pass();
      updateStatus();
      const nb=$("#bt-next");
      nb.disabled=false;
      nb.textContent=CUR.i<LEVELS.length-1?"下一关 ▶":"回到关卡表 ✓";
      CUR.testing=false;
      return;
    }
    const c=ts.cases[i];
    appendTerm("用例 "+(i+1)+"   "+c.in+(c.note?"    // "+c.note:""),"c");
    setTimeout(()=>{
      const ok=c.got===undefined||c.got===c.exp;
      appendTerm("  输出 "+(c.got!==undefined?c.got:c.exp)+" · 期望 "+c.exp+"  → "+(ok?"通过 ✓":"错误 ✗"),ok?"g":"r");
      i++;step();
    },460);
  };
  step();
}

/* ---- 启动 ---- */
$("#bt-map").onclick=()=>{sfx.click();renderMap();showScreen("scr-map")};
$("#bt-snd").onclick=()=>{SAVE.snd=!SAVE.snd;saveSave();updateStatus();if(SAVE.snd)sfx.click()};
loadSave();
renderTitle();
showScreen("scr-title");
updateStatus();
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready();
</script>
